<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- OpenLayers & qgis2web -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="resources/horsey.min.css">

    <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">

    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body,
    #map {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        overflow: hidden;
        background: #f5f7fa;
    }

    /* =========================================================
       OPENLAYERS CONTROL
    ========================================================= */

    .ol-control {
        background: rgba(255,255,255,0.85) !important;
        padding: 4px !important;
        border-radius: 12px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        backdrop-filter: blur(8px);
    }

    .ol-control > * {
        background: #ffffff !important;
        color: #444444 !important;
        border-radius: 8px !important;
        border: none !important;
        transition: all .2s ease;
    }

    .ol-control > *:hover,
    .ol-control > *:focus {
        background: #f1f5f9 !important;
        color: #111827 !important;
    }

    .ol-attribution {
        border-radius: 8px 0 0 0 !important;
    }

    .ol-attribution a {
        color: #555 !important;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .map-header {
        position: absolute;
        z-index: 1000;
        top: 18px;
        left: 18px;

        display: flex;
        align-items: center;
        gap: 14px;

        padding: 12px 20px;

        background: rgba(255,255,255,0.94);
        border-radius: 14px;

        box-shadow: 0 5px 20px rgba(0,0,0,0.12);

        backdrop-filter: blur(10px);
    }

    .map-logo {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #f58220;
        color: white;

        border-radius: 10px;

        font-size: 20px;
    }

    .map-title {
        display: flex;
        flex-direction: column;
    }

    .map-title strong {
        font-size: 16px;
        color: #1f2937;
        line-height: 1.2;
    }

    .map-title span {
        font-size: 12px;
        color: #6b7280;
        margin-top: 3px;
    }

    /* =========================================================
       INFO PANEL
    ========================================================= */

    .info-panel {
        position: absolute;
        z-index: 1000;

        top: 90px;
        left: 18px;

        width: 280px;

        background: rgba(255,255,255,0.95);

        border-radius: 14px;

        padding: 16px;

        box-shadow: 0 5px 20px rgba(0,0,0,0.10);

        backdrop-filter: blur(10px);
    }

    .info-title {
        font-size: 13px;
        font-weight: 600;

        color: #374151;

        margin-bottom: 10px;
    }

    .info-item {
        display: flex;
        align-items: center;
        gap: 9px;

        font-size: 12px;
        color: #6b7280;

        padding: 7px 0;
    }

    .info-icon {
        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #fff4e8;
        color: #f58220;

        border-radius: 7px;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-layer-input-search,
    .gcd-gl-input {
        background: rgba(255,255,255,0.95) !important;
        border: none !important;
        border-radius: 10px !important;
        box-shadow: 0 3px 12px rgba(0,0,0,0.12) !important;

        color: #374151 !important;
    }

    .search-layer-input-search::placeholder,
    .gcd-gl-input::placeholder {
        color: #9ca3af !important;
    }

    /* =========================================================
       POPUP
    ========================================================= */

    .ol-popup {
        background: white !important;

        border-radius: 14px !important;

        padding: 0 !important;

        box-shadow: 0 10px 35px rgba(0,0,0,0.20) !important;

        border: none !important;

        min-width: 280px;

        overflow: hidden;
    }

    .ol-popup:after {
        border-top-color: white !important;
    }

    .ol-popup-closer {
        position: absolute;

        top: 10px;
        right: 10px;

        width: 28px;
        height: 28px;

        background: rgba(0,0,0,0.05);

        border-radius: 50%;

        z-index: 10;
    }

    .ol-popup-closer:after {
        content: "×";

        font-size: 20px;

        color: #555;

        position: absolute;

        left: 7px;
        top: 1px;
    }

    #popup-content {
        padding: 18px;

        font-size: 13px;

        color: #4b5563;

        max-height: 400px;

        overflow-y: auto;
    }

    #popup-content table {
        width: 100%;
        border-collapse: collapse;
    }

    #popup-content td {
        padding: 6px 4px;

        border-bottom: 1px solid #f0f0f0;
    }

    #popup-content td:first-child {
        font-weight: 600;
        color: #374151;
    }

    /* =========================================================
       LAYER SWITCHER
    ========================================================= */

    .layer-switcher {
        border-radius: 12px !important;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 768px) {

        .map-header {
            top: 10px;
            left: 10px;
            right: 10px;

            padding: 10px 14px;
        }

        .map-logo {
            width: 36px;
            height: 36px;
            font-size: 17px;
        }

        .map-title strong {
            font-size: 14px;
        }

        .map-title span {
            font-size: 10px;
        }

        .info-panel {
            display: none;
        }

        .ol-control {
            border-radius: 10px !important;
        }

    }

    </style>

    <title>Peta SLS</title>
</head>


<body>

    <!-- =====================================================

        <div id="popup" class="ol-popup">

               id="popup-closer"
               class="ol-popup-closer">
            </a>

            <div id="popup-content"></div>

        </div>

    </div>


    <!-- =====================================================

    <div class="map-header">

        <div class="map-logo">

        </div>

        <div class="map-title">

        <div class="info-item">

            </span>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT QGIS2WEB
    ====================================================== -->

    <script src="resources/qgis2web_expressions.js"></script>

    <script src="./resources/functions.js"></script>

    <script src="./resources/ol.js"></script>

    <script src="resources/horsey.min.js"></script>

    <script src="resources/ol-search-layer.js"></script>

    <script src="./resources/ol-layerswitcher.js"></script>

    <script src="resources/photon-geocoder-autocomplete.min.js"></script>

    <script src="layers/PETA_SLS_1903_202501_1.js"></script>

    <script src="styles/PETA_SLS_1903_202501_1_style.js"></script>

    <script src="./layers/layers.js"
            type="text/javascript">
    </script>

    <script src="./resources/Autolinker.min.js"></script>

    <script src="./resources/qgis2web.js"></script>


</body>
</html>
